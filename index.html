<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #9aa0b4;
      --bright: #e4e6f0;
      --muted: #5d6275;
      --accent: #ffe14a;
      --line: #23263a;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(ellipse at top, #0b0d1c 0%, #000 70%) #000;
      color: var(--fg);
      font: 14px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }
    h1 {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 28px;
      letter-spacing: 0.35em;
    }
    .lead { margin: 0; color: var(--muted); }
    .soon { margin: 40px 0 0; color: var(--bright); letter-spacing: 0.35em; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    /* The ORBIT menu: a burger button that opens a drawer from the right (a modal <dialog>). */
    .burger {
      flex: none;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #07081280;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .burger:hover, .burger:focus-visible { border-color: #5a7dff; outline: none; }
    .burger i, .burger i::before, .burger i::after {
      display: block; width: 16px; height: 2px; background: var(--bright); border-radius: 1px; content: "";
    }
    .burger i { position: relative; }
    .burger i::before { position: absolute; top: -5px; }
    .burger i::after { position: absolute; top: 5px; }
    .drawer {
      margin: 0 0 0 auto;
      width: min(300px, 85vw);
      max-width: none;
      height: 100%;
      max-height: none;
      padding: 24px 16px;
      box-sizing: border-box;
      border: 0;
      border-left: 1px solid var(--line);
      background: #0a0c18;
      color: var(--fg);
      font: inherit;
    }
    .drawer[open] { animation: slide 0.18s ease-out; }
    @keyframes slide { from { transform: translateX(100%); } }
    .drawer::backdrop { background: #000a; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .drawer-head b { color: var(--accent); font-size: 14px; letter-spacing: 0.3em; }
    .close { padding: 4px 8px; border: 0; background: none; color: var(--muted); font: 20px/1 inherit; cursor: pointer; }
    .close:hover, .close:focus-visible { color: var(--bright); outline: none; }
    .drawer ul { margin: 0; padding: 0; list-style: none; }
    .drawer a {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      color: var(--bright);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-decoration: none;
    }
    .drawer a:hover, .drawer a:focus-visible { background: #ffffff0a; outline: none; }
    .drawer a span { color: var(--muted); letter-spacing: 0; }
    footer { margin-top: 56px; color: var(--muted); font-size: 12px; }
    .legal { font-size: 11px; }
    .legal a { color: var(--muted); }
    .legal a:hover, .legal a:focus-visible { color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>ARCADE</h1>
        <p class="lead">Original games in the spirit of the early-80s arcades.</p>
      </div>
      <button class="burger" type="button" aria-label="ORBIT menu" aria-haspopup="dialog" aria-controls="drawer"><i></i></button>
    </header>
    <dialog class="drawer" id="drawer" aria-label="ORBIT">
      <div class="drawer-head"><b>ORBIT</b><button class="close" type="button" aria-label="Close">&times;</button></div>
      <ul>
        <li><a href="prototypes/">PROTOTYPES <span>&#128274;</span></a></li>
        <li><a href="orbit/aufgaben/">ORBIT TEAM <span>&#128274;</span></a></li>
        <li><a href="orbit/konzept/">ORBIT CONCEPT <span>&#128274;</span></a></li>
        <li><a href="orbit/design/">ORBIT DESIGN <span>&#128274;</span></a></li>
        <li><a href="orbit/1982/">ORBIT 1982 <span>experiment</span></a></li>
      </ul>
    </dialog>
    <p class="soon">COMING SOON</p>
    <footer>
      <div class="legal"><a href="impressum.html">Impressum</a> &middot; <a href="datenschutz.html">Datenschutz</a></div>
    </footer>
  </main>
  <script>
    // The burger opens the drawer; Esc (built into <dialog>), the × and a click on the dark backdrop close it.
    const drawer = document.getElementById('drawer');
    document.querySelector('.burger').addEventListener('click', () => drawer.showModal());
    drawer.querySelector('.close').addEventListener('click', () => drawer.close());
    drawer.addEventListener('click', (e) => {
      const r = drawer.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) drawer.close();
    });
  </script>
</body>
</html>
