<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>PERSEIDS (test)</title>
  <meta name="robots" content="noindex">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #9aa0b4;
      font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The game fills the viewport as far as its 7:9 shape allows; black bars take the rest. */
    .screen {
      position: relative;
      width: min(100vw, calc(100vh * 7 / 9));
      height: min(100vh, calc(100vw * 9 / 7));
    }
    @supports (height: 100dvh) {
      .screen {
        width: min(100vw, calc(100dvh * 7 / 9));
        height: min(100dvh, calc(100vw * 9 / 7));
      }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .corner {
      position: fixed;
      z-index: 1;
      padding: 6px 10px;
      border: 1px solid #3a3e55;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: #9aa0b4;
      font: inherit;
      text-decoration: none;
      opacity: 0.55;
      cursor: pointer;
    }
    .corner:hover { opacity: 1; color: #e4e6f0; }
    #back { top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); }
    #full { bottom: max(10px, env(safe-area-inset-bottom)); right: max(10px, env(safe-area-inset-right)); }
    /* Controller diagnostics, only with ?pad in the address. */
    #pad {
      position: fixed;
      z-index: 2;
      top: max(44px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      margin: 0;
      padding: 8px 10px;
      max-width: calc(100vw - 40px);
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #3a3e55;
      border-radius: 4px;
      color: #9fe6ff;
      font: 11px/1.4 ui-monospace, Menlo, monospace;
      white-space: pre-wrap;
      pointer-events: none;
    }
    /* Nothing but the game in full screen. */
    html:fullscreen .corner, html.full .corner { display: none; }
  </style>
</head>
<body>
  <div class="screen">
    <canvas id="game" width="224" height="288" aria-label="PERSEIDS"></canvas>
  </div>
  <!-- Out of the tab order: a focus jump (on an iPad also from the controller) must not leave the game. -->
  <a id="back" class="corner" href="../../" tabindex="-1">&larr; ARCADE</a>
  <button id="full" class="corner" type="button" tabindex="-1" hidden>FULL SCREEN</button>
  <pre id="pad" hidden></pre>

  <script type="module">
    import { createPerseids } from './perseids.js';

    const root = document.documentElement;
    // The world high score list (arcade-api on Cloudflare Workers). The test page goes without it: its test keys allow cheating.
    const scoreServer = undefined;
    createPerseids(document.getElementById('game'), { fullscreenElement: root, scoreServer });

    // Full screen without a keyboard (F also works): iPad and desktop browsers; iPhones have no full screen API.
    const full = document.getElementById('full');
    const request = root.requestFullscreen ?? root.webkitRequestFullscreen;
    if (request && (document.fullscreenEnabled ?? document.webkitFullscreenEnabled)) {
      full.hidden = false;
      full.addEventListener('click', () => {
        full.blur();
        Promise.resolve(request.call(root)).catch(() => undefined);
      });
    }
    const sync = () => root.classList.toggle('full', !!(document.fullscreenElement ?? document.webkitFullscreenElement));
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);

    // ?pad: live controller diagnostics (connected pads, pressed buttons, focus, keyboard events).
    if (new URLSearchParams(location.search).has('pad')) {
      const out = document.getElementById('pad');
      out.hidden = false;
      const log = [];
      const note = (text) => {
        log.unshift(`${(performance.now() / 1000).toFixed(1)}s ${text}`);
        log.length = Math.min(log.length, 8);
      };
      for (const type of ['keydown', 'keyup']) {
        window.addEventListener(type, (e) => note(`${type} code=${e.code} key=${e.key}${e.shiftKey ? ' +shift' : ''}`), true);
      }
      window.addEventListener('blur', () => note('window blur (page lost focus)'));
      window.addEventListener('focus', () => note('window focus'));
      document.addEventListener('focusin', (e) => note(`focus -> ${e.target.tagName.toLowerCase()}${e.target.id ? '#' + e.target.id : ''}`));
      document.addEventListener('visibilitychange', () => note(`visibility ${document.visibilityState}`));
      window.addEventListener('gamepadconnected', (e) => note(`gamepad connected #${e.gamepad.index}`));
      window.addEventListener('gamepaddisconnected', (e) => note(`gamepad disconnected #${e.gamepad.index}`));
      const show = () => {
        const pads = Array.from(navigator.getGamepads?.() ?? []).filter(Boolean);
        const lines = pads.map((p) => {
          const down = p.buttons.map((b, i) => (b.pressed ? i : -1)).filter((i) => i >= 0);
          return `#${p.index} ${p.connected ? '' : '(gone) '}${p.mapping || 'no mapping'} ${p.id.slice(0, 40)}\n   buttons [${down.join(' ')}] axes ${p.axes.slice(0, 2).map((a) => a.toFixed(2)).join(' ')}`;
        });
        out.textContent = [`focus: ${document.hasFocus() ? 'page' : 'NOT the page'}, active: ${document.activeElement?.tagName.toLowerCase()}`, ...(lines.length ? lines : ['no gamepad (press a button)']), '', ...log].join('\n');
        requestAnimationFrame(show);
      };
      show();
    }
  </script>
</body>
</html>
