<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>PERSEIDS</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #9aa0b4;
      font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The game fills the viewport as far as its 7:9 shape allows; black bars take the rest. */
    .screen {
      position: relative;
      width: min(100vw, calc(100vh * 7 / 9));
      height: min(100vh, calc(100vw * 9 / 7));
    }
    @supports (height: 100dvh) {
      .screen {
        width: min(100vw, calc(100dvh * 7 / 9));
        height: min(100dvh, calc(100vw * 9 / 7));
      }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .corner {
      position: fixed;
      z-index: 1;
      padding: 6px 10px;
      border: 1px solid #3a3e55;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: #9aa0b4;
      font: inherit;
      text-decoration: none;
      opacity: 0.55;
      cursor: pointer;
    }
    .corner:hover { opacity: 1; color: #e4e6f0; }
    #back { top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); }
    #full { bottom: max(10px, env(safe-area-inset-bottom)); right: max(10px, env(safe-area-inset-right)); }
    /* Nothing but the game in full screen. */
    html:fullscreen .corner, html.full .corner { display: none; }
  </style>
</head>
<body>
  <div class="screen">
    <canvas id="game" width="224" height="288" aria-label="PERSEIDS"></canvas>
  </div>
  <a id="back" class="corner" href="../">&larr; ARCADE</a>
  <button id="full" class="corner" type="button" hidden>FULL SCREEN</button>

  <script type="module">
    import { createPerseids } from './perseids.js';

    const root = document.documentElement;
    createPerseids(document.getElementById('game'), { fullscreenElement: root });

    // Full screen without a keyboard (F also works): iPad and desktop browsers; iPhones have no full screen API.
    const full = document.getElementById('full');
    const request = root.requestFullscreen ?? root.webkitRequestFullscreen;
    if (request && (document.fullscreenEnabled ?? document.webkitFullscreenEnabled)) {
      full.hidden = false;
      full.addEventListener('click', () => {
        full.blur();
        Promise.resolve(request.call(root)).catch(() => undefined);
      });
    }
    const sync = () => root.classList.toggle('full', !!(document.fullscreenElement ?? document.webkitFullscreenElement));
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
  </script>
</body>
</html>
