    :root {

      --bad: #ff6a5c;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(ellipse at top, #0b0d1c 0%, #000 70%) #000;

      font: 14px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    main { max-width: 440px; margin: 0 auto; padding: 96px 16px 64px; }

    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    input {
      flex: 1 1 200px; min-width: 0; font: inherit; color: var(--bright);
      background: #07081280; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
    }
    input:focus-visible { outline: none; border-color: #5a7dff; }
    button {
      font: inherit; color: #000; background: var(--accent); border: 0; border-radius: 6px;
      padding: 10px 16px; letter-spacing: 0.15em; cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--bright); outline-offset: 2px; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .msg { min-height: 1.6em; margin: 12px 0 32px; color: var(--bad); }
    a { color: var(--muted); }
    a:hover, a:focus-visible { color: var(--fg); }

      const STORE = "arcade.unlock";
      async function deriveMaster(password, salt, iterations) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations, hash: 'SHA-256' }, base, 256);
  return new Uint8Array(bits);
}
      async function subkey(master, purpose, algorithm, usages) {
  const base = await crypto.subtle.importKey('raw', master, 'HKDF', false, ['deriveKey']);
  const params = { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: new TextEncoder().encode(purpose) };
  return crypto.subtle.deriveKey(params, base, algorithm, false, usages);
}
      async function openPayload(master, payload) {
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const key = await subkey(master, 'arcade-lock-v1 enc', { name: 'AES-GCM', length: 256 }, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
      const b64 = (bytes) => btoa(String.fromCharCode(...bytes));
      const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const forget = () => { try { localStorage.removeItem(STORE); } catch {} };
      // Every script gets a blob URL in place of its address; then the page replaces this one.
      const show = ({ page, files }) => {
        for (const [name, text] of Object.entries(files)) {
          const url = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
          page = page.split('@arcade-lock:' + name + '@').join(url);
        }
        document.open();
        document.write(page);
        document.close();
      };
      const lock = document.getElementById('lock');
      const form = document.getElementById('unlock');
      const pw = document.getElementById('pw');
      const go = document.getElementById('go');
      const msg = document.getElementById('msg');
      const ask = (text) => {
        lock.hidden = false;
        msg.textContent = text;
        pw.focus();
      };
      if (!window.crypto || !crypto.subtle) return ask('Dieser Browser kann die Seite nicht entschlüsseln.');

      // Unlocked before in this browser: open without asking.
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch {}
      if (saved && saved.salt === D.salt && saved.iter === D.iter && typeof saved.key === 'string') {
        let content = null;
        try { content = await openPayload(bytes(saved.key), D); } catch { forget(); }
        if (content) return show(content);
      }
      ask('');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        go.disabled = true;
        msg.textContent = '';
        let master, content;
        try {
          master = await deriveMaster(pw.value, D.salt, D.iter);
          content = await openPayload(master, D);
        } catch {
          msg.textContent = 'Falsches Passwort.';
          go.disabled = false;
          pw.select();
          return;
        }
        try { localStorage.setItem(STORE, JSON.stringify({ salt: D.salt, iter: D.iter, key: b64(master) })); } catch {}
        show(content);
      });
    })();
