<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>ORBIT Konzept</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #9aa0b4;
      --bright: #e4e6f0;
      --muted: #5d6275;
      --accent: #ffe14a;
      --line: #23263a;
      --bad: #ff6a5c;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(ellipse at top, #0b0d1c 0%, #000 70%) #000;
      color: var(--fg);
      font: 14px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    main { max-width: 440px; margin: 0 auto; padding: 96px 16px 64px; }
    h1 { margin: 0 0 4px; color: var(--accent); font-size: 28px; letter-spacing: 0.35em; }
    p { margin: 0 0 24px; color: var(--muted); }
    form { display: flex; flex-wrap: wrap; gap: 8px; }
    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    input {
      flex: 1 1 200px; min-width: 0; font: inherit; color: var(--bright);
      background: #07081280; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
    }
    input:focus-visible { outline: none; border-color: #5a7dff; }
    button {
      font: inherit; color: #000; background: var(--accent); border: 0; border-radius: 6px;
      padding: 10px 16px; letter-spacing: 0.15em; cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--bright); outline-offset: 2px; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .msg { min-height: 1.6em; margin: 12px 0 32px; color: var(--bad); }
    a { color: var(--muted); }
    a:hover, a:focus-visible { color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>ORBIT</h1>
    <p>Konzept und Umsetzungsplan. Die Seite ist verschlüsselt und öffnet sich nur mit dem Passwort.</p>
    <form id="unlock">
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required autofocus>
      <button id="go" type="submit">ÖFFNEN</button>
    </form>
    <p class="msg" id="msg" role="alert"></p>
    <a href="../../">&larr; ARCADE</a>
  </main>

      const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const form = document.getElementById('unlock');
      const pw = document.getElementById('pw');
      const go = document.getElementById('go');
      const msg = document.getElementById('msg');
      async function decrypt(password) {
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(D.salt), iterations: D.iter, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, key, bytes(D.data));
        return new TextDecoder().decode(plain);
      }
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!window.crypto || !crypto.subtle) {
          msg.textContent = 'Dieser Browser kann die Seite nicht entschlüsseln.';
          return;
        }
        go.disabled = true;
        msg.textContent = '';
        let html;
        try {
          html = await decrypt(pw.value);
        } catch {
          msg.textContent = 'Falsches Passwort.';
          go.disabled = false;
          pw.select();
          return;
        }
        document.open();
        document.write(html);
        document.close();
      });
