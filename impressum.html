<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Impressum – Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #9aa0b4;
      --bright: #e4e6f0;
      --muted: #5d6275;
      --accent: #ffe14a;
      --link: #8fa6ff;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(ellipse at top, #0b0d1c 0%, #000 70%) #000;
      color: var(--fg);
      font: 14px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { margin: 0 0 24px; color: var(--accent); font-size: 22px; letter-spacing: 0.2em; }
    p { margin: 0 0 12px; }
    a { color: var(--link); }
    .back { display: inline-block; margin-bottom: 32px; color: var(--muted); text-decoration: none; }
    .back:hover, .back:focus-visible { color: var(--bright); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <a class="back" href="./">&larr; ARCADE</a>
    <h1>IMPRESSUM</h1>
    <p class="muted">Angaben gemäß § 5 DDG</p>
    <p>André Heßler<br>Waldstraße 21<br>90607 Rückersdorf</p>
    <p>E-Mail: <a href="mailto:info@focusjunkie.de">info@focusjunkie.de</a></p>
    <p class="muted">Private, nicht kommerzielle Website. <a href="datenschutz.html">Datenschutz</a></p>
  </main>
</body>
</html>
